name: Testes

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Instalar dependências
        run: pip install -r server/requirements.txt

      - name: Rodar a suíte de testes
        working-directory: server
        run: python -m pytest tests -q

      - name: Gerar placa de captura e imagem demo (smoke)
        working-directory: server
        run: |
          python tools/generate_markers.py --out /tmp/placa.pdf
          python tools/make_demo_image.py --out /tmp/demo.jpg
          head -c 4 /tmp/placa.pdf | grep -q '%PDF'
